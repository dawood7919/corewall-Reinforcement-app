name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android NDK for local LibreDWG reader
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;27.2.12479018" "cmake;3.22.1"

      # فحص نصّي بيجري في تانيتين قبل بناء مدته خمس دقايق. بيمسك غلطة
      # واحدة بس — لامدا لاحقة على دالة آخر بارامتر فيها مش دالة — لأن
      # الغلطة دي بالذات وقّعت بناءين ورا بعض من غير ما يوصل للمستخدم حاجة.
      - name: Fast textual checks that would otherwise fail the build
        run: python3 tools/check_trailing_lambda.py

      - name: Build debug APK
        env:
          # بيتحط في BuildConfig.BUILD_COMMIT فشاشة "عن التطبيق" بتقول
          # الكوميت اللي البناء اللي على الجهاز جاي منه بالظبط.
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleFullDebug assembleTakeoffDebug --no-daemon --console=plain \
            2>&1 | tee /tmp/build.log

      # لما البناء يقع، جريدل بيقول "Compilation error. See log for more
      # details" وبس — والسطور اللي فيها الملف والرقم بتبقى فوق بآلاف
      # السطور، وسجل الـActions لما يتقص بتروح معاه. الخطوة دي بتطلّعها
      # تاني في آخر السجل، فالفشل بيتقرا من غير ما تنزّل السجل كله.
      - name: Show compile errors
        if: failure()
        run: |
          echo "───────── compile errors ─────────"
          grep -E "^e: |error:" /tmp/build.log | head -60 || echo "(no e: lines in the log)"

      # اختبارات الوحدة قبل أي نشر. المحرّك الهندسي والـPDF متثبّتين
      # باختبارات، فأي "تحسين أداء" بيغيّر رقم بيوقّع البناء هنا مش على
      # جهاز المستخدم.
      - name: Run unit tests
        run: ./gradlew testFullDebugUnitTest --no-daemon

      - name: Test local DWG geometry fixtures
        run: bash tools/test_dwg_host.sh

      # الترحيلات مجرد نصّ SQL، فالكومبايلر مش شايفها. الفحص ده بيقارنها
      # بالمخطط اللي Room ولّده — أي فهرس ناقص أو زيادة معناه إن التطبيق
      # هيقفل أول ما يفتح عند اللي بيحدّث، فبنوقّع البناء هنا قبل النشر.
      - name: Verify Room migrations match the generated schema
        run: python3 tools/check_room_schema.py

      # أسماء ثابتة للنشر. النسخة الكاملة بتفضل `app-debug.apk` عن قصد:
      # ده الاسم اللي رابط الإصدار الثابت بيشاور عليه، وتغييره بيكسر أي
      # لينك متبعت قبل كده.
      - name: Collect APKs under stable names
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/full/debug/app-full-debug.apk dist/app-debug.apk
          cp app/build/outputs/apk/takeoff/debug/app-takeoff-debug.apk dist/app-takeoff-debug.apk

      # علامة الإصدار للتحديث من جوّه التطبيق.
      #
      # الوسم ثابت (`latest-debug`) والملفات بتتكتب فوق بعضها كل بناء، يعني
      # مفيش حاجة في الإصدار نفسه بتقول ده أنهي إصدار. الملف ده بيقول —
      # والتطبيق بيقارن `versionCode` بتاعه بيه. مفتاح لكل تطبيق لأن نسخة
      # الحصر `applicationId` مختلف وبتتحدّث لوحدها.
      - name: Publish version marker
        run: |
          CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          BASE=https://github.com/${{ github.repository }}/releases/download/latest-debug
          cat > dist/version.json <<JSON
          {
            "com.corewall.qaqc":         { "versionCode": $CODE, "versionName": "$NAME",          "url": "$BASE/app-debug.apk" },
            "com.corewall.qaqc.takeoff": { "versionCode": $CODE, "versionName": "$NAME-takeoff",  "url": "$BASE/app-takeoff-debug.apk" },
            "commit": "${GITHUB_SHA::7}"
          }
          JSON
          cat dist/version.json

      # برانش orphan بكوميت واحد بيتعمله force-push كل بناء — قناة توزيع ثابتة
      # للـAPK تشتغل بـgit فقط (مفيدة لمّا تحميل الـartifacts/الـreleases مش متاح).
      - name: Push APK to apk-latest branch
        run: |
          mkdir -p /tmp/apkdist
          cp dist/app-debug.apk dist/app-takeoff-debug.apk dist/version.json /tmp/apkdist/
          cd /tmp/apkdist
          git init -b apk-latest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-debug.apk app-takeoff-debug.apk version.json
          git commit -m "Debug APK from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-latest

      # لقطات الشاشة — بترسم مكوّنات حقيقية على الـJVM وتتحفظ كصور.
      #
      # بعد النشر عن قصد: الرندر بيشتغل في بيئة من غير جهاز ولا محاكي، وأي
      # عطل فيه مالوش علاقة بالتطبيق. لو وقع، الـAPK يكون خرج خلاص.
      - name: Render UI screenshots
        if: always()
        continue-on-error: true
        run: |
          ./gradlew testFullDebugUnitTest -Pscreenshots=true --no-daemon --console=plain \
            --tests "com.corewall.qaqc.shots.*"

      - name: Push screenshots to the screenshots branch
        if: always()
        continue-on-error: true
        run: |
          SHOTS=app/build/screenshots
          if [ ! -d "$SHOTS" ] || [ -z "$(ls -A "$SHOTS"/*.png 2>/dev/null)" ]; then
            echo "مفيش صور اتولّدت — الخطوة اللي فاتت غالباً فشلت."
            exit 0
          fi
          rm -rf /tmp/shots && mkdir -p /tmp/shots
          cp "$SHOTS"/*.png /tmp/shots/
          cd /tmp/shots
          git init -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.png
          git commit -m "Screenshots from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" screenshots

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: corewall-qaqc-debug-apk
          path: |
            dist/app-debug.apk
            dist/app-takeoff-debug.apk

      - name: Create / update GitHub Release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Core Wall QA/QC — Debug APK (latest)
          prerelease: true
          files: |
            dist/app-debug.apk
            dist/app-takeoff-debug.apk
            dist/version.json
          body: |
            أحدث نسخة Debug من تطبيق Core Wall QA/QC (بناء تلقائي من GitHub Actions).
            • app-debug.apk — التطبيق الكامل (فحص · عمالة · ملاحظات · حصر).
            • app-takeoff-debug.apk — الحصر لوحده، بيتثبّت جنب الكامل مش فوقه.
            الاتنين موقّعين بمفتاح Android الافتراضي للـ Debug.
