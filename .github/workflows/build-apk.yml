name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: corewall-qaqc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create / update GitHub Release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Core Wall QA/QC — Debug APK (latest)
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            أحدث نسخة Debug من تطبيق Core Wall QA/QC (بناء تلقائي من GitHub Actions).
            حمّل ملف app-debug.apk وثبّته مباشرة — موقّع بمفتاح Android الافتراضي للـ Debug.
