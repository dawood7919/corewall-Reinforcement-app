name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          # بيتحط في BuildConfig.BUILD_COMMIT فشاشة "عن التطبيق" بتقول
          # الكوميت اللي البناء اللي على الجهاز جاي منه بالظبط.
          BUILD_COMMIT: ${{ github.sha }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # الترحيلات مجرد نصّ SQL، فالكومبايلر مش شايفها. الفحص ده بيقارنها
      # بالمخطط اللي Room ولّده — أي فهرس ناقص أو زيادة معناه إن التطبيق
      # هيقفل أول ما يفتح عند اللي بيحدّث، فبنوقّع البناء هنا قبل النشر.
      - name: Verify Room migrations match the generated schema
        run: python3 tools/check_room_schema.py

      # برانش orphan بكوميت واحد بيتعمله force-push كل بناء — قناة توزيع ثابتة
      # للـAPK تشتغل بـgit فقط (مفيدة لمّا تحميل الـartifacts/الـreleases مش متاح).
      - name: Push APK to apk-latest branch
        run: |
          mkdir -p /tmp/apkdist
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apkdist/
          cd /tmp/apkdist
          git init -b apk-latest
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app-debug.apk
          git commit -m "Debug APK from ${GITHUB_SHA::7}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-latest

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: corewall-qaqc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create / update GitHub Release (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Core Wall QA/QC — Debug APK (latest)
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            أحدث نسخة Debug من تطبيق Core Wall QA/QC (بناء تلقائي من GitHub Actions).
            حمّل ملف app-debug.apk وثبّته مباشرة — موقّع بمفتاح Android الافتراضي للـ Debug.
